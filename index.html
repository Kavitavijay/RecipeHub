<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>RecipeHub | Discover Delicious Recipes</title>

    <!-- Google Fonts -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
        href="css/style.css">

    <link rel="stylesheet"
        href="css/navbar.css">

    <link rel="stylesheet"
        href="css/home.css">

    <link rel="stylesheet"
        href="css/cards.css">

    <link rel="stylesheet"
        href="css/footer.css">

    <link rel="stylesheet"
        href="css/responsive.css">

    <link rel="stylesheet"
        href="css/animations.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar">

            <div class="logo">

                <i class="fa-solid fa-utensils"></i>

                <span>RecipeHub</span>

            </div>

            <ul class="nav-links">

                <li><a href="index.html">Home</a></li>

                <li><a href="#recipes">Recipes</a></li>

                <li><a href="favorites.html">Favorites</a></li>

                <li><a href="about.html">About</a></li>

                <li><a href="contact.html">Contact</a></li>

            </ul>

            <div class="menu-btn">

                <i class="fa-solid fa-bars"></i>

            </div>

        </nav>

    </header>

    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <h1>Cook Something Amazing Today</h1>

            <p>

                Discover thousands of recipes from around the world.

            </p>

            <!-- Search -->

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search recipes...">
                    


                <button id="searchButton">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button> 

            </div>

        </div>

    </section>

    <!-- ================= Featured Recipes ================= -->
    <section class="featured-section">

    <h2>Featured Recipes</h2>

    <div
        id="featuredRecipes"
        class="recipe-grid">
    </div>

    </section>

    <!-- ================= CATEGORY ================= -->

    <section class="category-section">

        <h2>Browse Categories</h2>

        <div id="categoryContainer" class="categories"></div>

    </section>

    <!-- ================= RECIPES ================= -->

    <section
        id="recipes"
        class="recipes">

    
        
        <div class="recipe-header" >
            <h2>Popular Recipes</h2>
        </div>


        <div
            id="recipeContainer"
            class="recipe-grid">

        </div>

    </section>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026 RecipeHub | Made with ❤️ using HTML CSS JavaScript

        </p>

    </footer>

    <!-- Scripts -->

    <script type="module" src="js/app.js"></script>


</body>

</html>
